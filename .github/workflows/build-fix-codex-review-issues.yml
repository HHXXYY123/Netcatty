name: build-fix-codex-review-issues

on:
  push:
    branches:
      - fix-codex-review-issues
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  NPM_CONFIG_FETCH_RETRIES: "4"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"

jobs:
  build-windows:
    name: build-windows-fix-codex-review-issues
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Electron download cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Install deps
        run: npm ci

      - name: Set version
        shell: bash
        run: |
          VERSION="0.0.0-fix-codex-${GITHUB_SHA:0:7}"
          echo "Setting version to ${VERSION}"
          npm pkg set version="${VERSION}"

      - name: Build package
        env:
          ELECTRON_BUILDER_PUBLISH: "never"
        run: npm run pack:win-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: netcatty-fix-codex-review-issues-windows
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error
